services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "19090:8080"
    depends_on:
      - postgres
    networks:
      - keycloak








  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 3000
      KEYCLOAK_URL: http://localhost:19090
      KEYCLOAK_REALM: Users
    ports:
      - "18080:3000"
    networks:
      - backend
    volumes:
      - ./server:/server








  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 80
      KEYCLOAK_URL: http://localhost:19090
      KEYCLOAK_REALM: Users
      BACKEND_URL: http://localhost:18080
    ports:
      - "10000:80"
    networks:
      - frontend
    volumes:
      - ./client:/client








volumes:
  postgres_data:

networks:
  keycloak:
  backend:
  frontend:
