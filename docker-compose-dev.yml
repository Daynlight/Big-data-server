  backend-postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: big-data-server
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "big-data-server"]
      interval: 5s
      retries: 5
    ports:
      - "15433:5432"
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 3000
      KEYCLOAK_URL: auth.daynlight.pl
      KEYCLOAK_PROTOCOL: https
      KEYCLOAK_REALM: Big-data-server-users
      POSTGRES_BACKEND_HOST: backend-postgres
      POSTGRES_BACKEND_DB: big-data-server
      POSTGRES_BACKEND_USER: admin
      POSTGRES_BACKEND_PASSWORD: admin
    ports:
      - "18080:3000"
    depends_on:
      backend-postgres:
        condition: service_healthy
    networks:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server:/server








  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 80
      VITE_KEYCLOAK_URL: auth.daynlight.pl
      VITE_KEYCLOAK_PROTOCOL: https
      VITE_KEYCLOAK_REALM: Big-data-server-users
      VITE_BACKEND_URL: localhost:18080
      VITE_BACKEND_PROTOCOL: http
    ports:
      - "10000:80"
    networks:
      - frontend
    volumes:
      - ./client:/client








volumes:
  keycloak_postgres_data:
  backend_postgres_data:

networks:
  keycloak:
  backend:
  frontend:
