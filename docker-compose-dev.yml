services:
  keycloak-postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      retries: 5
    ports:
      - "15432:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "19090:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - keycloak








  backend-postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: big-data-server
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "big-data-server"]
      interval: 5s
      retries: 5
    ports:
      - "15433:5432"
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 3000
      KEYCLOAK_URL: http://localhost:19090
      KEYCLOAK_REALM: Big-data-server-users
      POSTGRES_BACKEND_HOST: backend-postgres
      POSTGRES_BACKEND_DB: big-data-server
      POSTGRES_BACKEND_USER: admin
      POSTGRES_BACKEND_PASSWORD: admin
    ports:
      - "18080:3000"
    depends_on:
      backend-postgres:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - ./server:/server








  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      PORT: 80
      VITE_KEYCLOAK_URL: http://localhost:19090
      VITE_KEYCLOAK_REALM: Big-data-server-users
      VITE_BACKEND_URL: http://localhost:18080
    ports:
      - "10000:80"
    networks:
      - frontend
    volumes:
      - ./client:/client








volumes:
  keycloak_postgres_data:
  backend_postgres_data:

networks:
  keycloak:
  backend:
  frontend:
